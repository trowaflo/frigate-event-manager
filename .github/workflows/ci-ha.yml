name: Home Assistant CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      _HARDEN_DEFAULTS: >-
        agent.api.stepsecurity.io:443
        github.com:443
        api.github.com:443
        ghcr.io:443
        pkg-containers.githubusercontent.com:443
        raw.githubusercontent.com:443
        brands.home-assistant.io:443
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: ${{ env._HARDEN_DEFAULTS }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # L'action déclare son image par tag flottant (ghcr.io/hacs/action:main) : on la fige
      # par digest et on recopie les défauts de son action.yml, `docker://` n'en applique aucun.
      - uses: docker://ghcr.io/hacs/action:main@sha256:187499a09c5d41f9f0d42ff80d203ed87b974c028290140913b61e005fb0aab2
        with:
          category: integration
          ignore: ""
          comment: "true"
          github_token: ${{ github.token }}

  hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      _HARDEN_DEFAULTS: >-
        agent.api.stepsecurity.io:443
        github.com:443
        api.github.com:443
        ghcr.io:443
        pkg-containers.githubusercontent.com:443
        raw.githubusercontent.com:443
        brands.home-assistant.io:443
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: ${{ env._HARDEN_DEFAULTS }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@5752577ea7cc5aefb064b0b21432f18fe4d6ba90 # master (no semver releases)
