name: Release

on:
  push:
    branches: [main]

permissions: read-all

jobs:
  release:
    uses: trowaflo/github-actions/.github/workflows/release.yml@c62d1b93d63953495704ff3c980b0ec8414e54f9 # v4.0.1
    permissions:
      contents: write
      pull-requests: write
    with:
      enable_release_please: true
