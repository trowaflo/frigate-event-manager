name: Release

on:
  push:
    branches: [main]

permissions: read-all

jobs:
  release:
    uses: trowaflo/github-actions/.github/workflows/release.yml@6268fe615c62071abe11fc17d0b78c4bbd5f8a52 # v4.0.0
    permissions:
      contents: write
      pull-requests: write
    with:
      enable_release_please: true
