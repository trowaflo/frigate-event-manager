name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  security:
    uses: trowaflo/github-actions/.github/workflows/security.yml@745d89e5792c3f9dd0c62e33a1065afd2eadc7a7 # v3.0.0
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    with:
      enable_dependency_review: true
      enable_checkov: true
      enable_trivy: true

  lint:
    uses: trowaflo/github-actions/.github/workflows/lint.yml@745d89e5792c3f9dd0c62e33a1065afd2eadc7a7 # v3.0.0
    permissions:
      contents: read
      security-events: write
    with:
      enable_markdown_lint: true
      enable_json_lint: true
      harden_runner_egress_policy: audit

  ha:
    uses: trowaflo/github-actions/.github/workflows/ci-ha.yml@745d89e5792c3f9dd0c62e33a1065afd2eadc7a7 # v3.0.0
    permissions:
      contents: read
    with:
      enable_hacs: true
      enable_hassfest: true

  python:
    uses: trowaflo/github-actions/.github/workflows/ci-python.yml@745d89e5792c3f9dd0c62e33a1065afd2eadc7a7 # v3.0.0
    permissions:
      contents: read
    with:
      enable_lint: true
      enable_test: true
      coverage_path: custom_components/frigate_event_manager
      extra_packages: pytest-homeassistant-custom-component
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
