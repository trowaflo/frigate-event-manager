name: Release

on:
  push:
    branches: [main]

permissions: read-all

jobs:
  release:
    uses: trowaflo/github-actions/.github/workflows/release.yml@5fb2cae3cedca812c197e489685f810eef7f286d # v1.2.0
    permissions:
      contents: write
      pull-requests: write
    with:
      enable_release_please: true
