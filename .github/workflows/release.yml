name: Release

on:
  push:
    branches: [main]

permissions: read-all

jobs:
  release:
    uses: trowaflo/github-actions/.github/workflows/release.yml@9c55705cbbca2481656de92c10402a7d27ef61ab # v5.0.0
    permissions:
      contents: write
      pull-requests: write
    with:
      enable_release_please: true
