name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  security:
    uses: trowaflo/github-actions/.github/workflows/security.yml@3f2cc0504b841ef8f0b1dfcc4edd273309eebd27 # v5.1.1
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    with:
      enable_dependency_review: true
      enable_checkov: true
      enable_trivy: true

  lint:
    uses: trowaflo/github-actions/.github/workflows/lint.yml@3f2cc0504b841ef8f0b1dfcc4edd273309eebd27 # v5.1.1
    permissions:
      contents: read
      security-events: write
    with:
      enable_markdown_lint: true
      enable_json_lint: true
      harden_runner_egress_policy: audit
